# ResilientPOS 알림 규칙의 정본이다. 로컬은 lgtm의 Prometheus가 싣고, 운영은 같은 파일을 Mimir ruler에 올린다.
# 조건과 조치는 docs/wiki/runbook.md, metric의 뜻은 docs/wiki/observability.md에 있다.
# 검증: docker/prometheus/alerts.test.yaml(promtool), AlertRulesTest가 ./gradlew test에서 돌린다.
# 여러 pod가 같은 DB를 세는 gauge는 max로 모으고, pod마다 도는 작업은 instance별로 본다.
# increase(x[W]) > 0은 마지막 증가 뒤에도 W 동안 참이라, for를 두는 규칙의 창은 for보다 짧게 둔다(scrape 15초의 4배 이상).
groups:
  # HttpErrorBudgetSlowBurn이 3일 창을 평가마다 원시 series로 읽지 않도록 5분 rate를 기록한다.
  # 해당 series가 없을 때 0을 남겨야 3일 평균의 분모와 분자가 같은 구간을 센다.
  - name: resilientpos-records
    rules:
      - record: resilientpos:http_v1_errors:rate5m
        expr: sum(rate(http_server_requests_seconds_count{application="ResilientPOS", uri=~"/v1/.*", status=~"5.."}[5m])) or vector(0)
      - record: resilientpos:http_v1_requests:rate5m
        expr: sum(rate(http_server_requests_seconds_count{application="ResilientPOS", uri=~"/v1/.*", status!="429"}[5m])) or vector(0)

  - name: resilientpos
    rules:
      - alert: ResilientPosMetricsAbsent
        # 아래 규칙은 모두 앱이 내는 series에 기댄다. 모든 인스턴스가 죽거나 scrape가 끊기면 그 규칙들은 빈 결과라 울리지 않는다.
        expr: absent(process_uptime_seconds{application="ResilientPOS"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: ResilientPOS 인스턴스의 metric이 5분 넘게 보이지 않는다
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#resilientposmetricsabsent

      - alert: EventPublicationOverdue
        # 경과 시간은 상태가 FAILED와 RESUBMITTED를 오가도 계속 는다. failed 개수는 재전송 중인 행을 세지 않아 브로커 장애 중에도 0이 될 수 있다.
        # 1시간은 #77 측정의 가장 긴 회복(Kafka 재시작부터 미완료 0까지 27분)보다 길어 정상 회복에는 울지 않는다.
        expr: max(event_publication_incomplete_oldest_seconds{application="ResilientPOS"}) > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 1시간 넘게 나가지 못한 발행 기록이 있다
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#eventpublicationoverdue

      - alert: EventPublicationMetricStale
        # 갱신이 실패한 인스턴스는 시각을 멈춘다. 갱신 주기는 1분이다.
        expr: time() - event_publication_incomplete_refreshed_seconds{application="ResilientPOS"} > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} 인스턴스가 발행 기록을 5분 넘게 세지 못했다"
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#eventpublicationmetricstale

      - alert: KafkaDeadLetter
        # 재투입도 폐기도 하지 않은 DLT 메시지 수다. 처리하면 다음 갱신(1분)에 0이 되어 풀린다. 원인(reason)은 runbook에서 counter로 본다.
        # 모든 인스턴스가 같은 DLT와 DB를 세므로 max로 묶는다. 첫 갱신 전 NaN은 max에서 빠진다.
        # 갱신이 실패한 인스턴스는 마지막 값을 유지한다. 5분 안에 센 인스턴스가 있으면 그 값만 봐서 멈춘 인스턴스의 옛 값이 알림을 붙잡지 않게 하고,
        # 모든 인스턴스가 세지 못하면(브로커 장애) 마지막 값으로 유지한다. 그동안은 새 DLT도 재투입·폐기도 일어날 수 없다.
        expr: |
          max by (topic) (
            event_kafka_dead_letter_unhandled{application="ResilientPOS"}
            and on (instance) (time() - event_kafka_dead_letter_unhandled_refreshed_seconds{application="ResilientPOS"} < 300)
          ) > 0
          or
          (
            max by (topic) (event_kafka_dead_letter_unhandled{application="ResilientPOS"}) > 0
            unless on () (time() - event_kafka_dead_letter_unhandled_refreshed_seconds{application="ResilientPOS"} < 300)
          )
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.topic }}의 DLT에 처리하지 않은 메시지가 {{ $value }}건 있다"
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#kafkadeadletter

      - alert: KafkaDeadLetterPublishFailed
        # 둘째 줄은 10분 전까지 1시간 동안 없던 series다. 기동 때 0으로 등록하지만 첫 scrape 전에 오른 값을 놓치지 않으려는 것이다.
        # range 조회라 scrape 실패로 생긴 stale marker를 "없던 series"로 보지 않는다.
        # 전송이 다시 되면 메시지는 DLT로 가서 KafkaDeadLetter가 잡으므로 증가가 멈춘 뒤 붙잡지 않는다.
        expr: |
          sum by (topic) (increase(event_kafka_dead_letter_failed_total{application="ResilientPOS"}[10m])) > 0
          or
          sum by (topic) (
            event_kafka_dead_letter_failed_total{application="ResilientPOS"}
            unless on (instance, topic) last_over_time(event_kafka_dead_letter_failed_total{application="ResilientPOS"}[1h] offset 10m)
          ) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.topic }} 메시지를 DLT로 보내지 못해 같은 메시지를 다시 처리하고 있다"
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#kafkadeadletterpublishfailed

      - alert: KafkaConsumerLag
        # Kafka 클라이언트가 같은 토픽을 점이 밑줄로 바뀐 이름으로 한 번 더 내므로 점이 있는 이름만 본다.
        # shortcut: 1000은 판별만 확인된 값이다(#77: 정상 부하 lag 0, provider 1초 지연에 1분 2,398). 실제 PG 지연 분포가 생기면 다시 본다.
        expr: max by (topic, partition) (kafka_consumer_fetch_manager_records_lag{application="ResilientPOS", topic=~".+[.].+"}) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.topic }} 파티션 {{ $labels.partition }}의 consumer lag가 10분 넘게 1000을 넘는다"
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#kafkaconsumerlag

      - alert: EventPublicationResubmitterNotSucceeding
        # 기동한 뒤 한 번도 성공하지 못한 작업은 SUCCESS series가 없으므로 살아 있는 인스턴스를 기준으로 뺀다.
        # 기동 뒤 5분(작업 첫 실행은 1분 뒤)은 보지 않는다.
        expr: |
          process_uptime_seconds{application="ResilientPOS"} > 300
          unless on (instance)
          increase(tasks_scheduled_execution_seconds_count{application="ResilientPOS", code_function="resubmitAndPurge", outcome="SUCCESS"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}의 발행 기록 재전송 작업이 20분 넘게 성공하지 못했다"
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#eventpublicationresubmitternotsucceeding

      - alert: UnknownPaymentResolverNotSucceeding
        expr: |
          process_uptime_seconds{application="ResilientPOS"} > 300
          unless on (instance)
          increase(tasks_scheduled_execution_seconds_count{application="ResilientPOS", code_function="resolveUnknown", outcome="SUCCESS"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}의 결과 불명 결제 확정 작업이 20분 넘게 성공하지 못했다"
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#unknownpaymentresolvernotsucceeding

      - alert: KafkaDeadLetterMetricNotSucceeding
        # 미처리 DLT gauge는 갱신이 실패하면 마지막 값에 멈추고, 한 번도 성공하지 못하면 NaN이라 KafkaDeadLetter가 울 수 없다.
        expr: |
          process_uptime_seconds{application="ResilientPOS"} > 300
          unless on (instance)
          increase(tasks_scheduled_execution_seconds_count{application="ResilientPOS", code_function="countUnhandled", outcome="SUCCESS"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}의 미처리 DLT 갱신 작업이 20분 넘게 성공하지 못했다"
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#kafkadeadlettermetricnotsucceeding

      - alert: UnknownPaymentResolutionStuck
        # 경과 시간은 넘기지 않은 가장 오래된 결과 불명 시도의 생성 시각부터다. DB에서 다시 세므로 재기동해도 첫 갱신 뒤 5분이면 다시 운다.
        # 정상이면 한 건은 조회 상한(약 1시간) 안에 확정되거나 reconciliation으로 넘어간다.
        expr: max(payment_attempt_resolution_oldest_seconds{application="ResilientPOS"}) > 7200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 넘기지 않은 결과 불명 결제가 2시간 넘게 남아 있다
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#unknownpaymentresolutionstuck

      - alert: ReconciliationPendingUnresolved
        # 경과 시간은 넘긴 결과 불명 시도 가운데 가장 이른 넘긴 시각부터다. case 열기가 실패해 DLT에 간 시도도 여기 든다.
        expr: max(payment_attempt_reconciliation_pending_oldest_seconds{application="ResilientPOS"}) > 86400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: reconciliation으로 넘긴 결과 불명 결제가 24시간 넘게 해소되지 않았다
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#reconciliationpendingunresolved

      - alert: LockFailOpen
        # 배포·재기동 중 한두 번은 넘기고 이어질 때만 본다. 이 counter는 처음 fail-open될 때 생겨 첫 증가는 세지 않는다.
        # Redis 장애 때는 주기 작업 둘이 pod마다 1분에 한 번 락을 잡아 2분 창이 끊기지 않는다.
        # 주기 작업 락의 대기 초과는 보지 않는다. pod가 여럿이면 늦은 pod가 앞 pod의 긴 블록(회복 중 재전송, PG 조회)을 기다리다 매분 대기 한도(1.5초)를 넘기는 것이 정상이다.
        # shortcut: 10분은 근거 없는 시작값이다(#103 판정). 업무 락의 대기 초과가 장애 밖에서 생기면 다시 본다.
        expr: |
          sum by (lock, reason) (
            increase(lock_fail_open_total{application="ResilientPOS"}[2m])
            unless
            increase(lock_fail_open_total{application="ResilientPOS", lock=~"platform:event-publication|payment:unknown-resolve", reason="timeout"}[2m])
          ) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.lock }} 락이 10분 넘게 잠그지 못하고 진행한다(reason={{ $labels.reason }})"
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#lockfailopen

      - alert: SyncConflict
        expr: sum(increase(sync_operation_total{application="ResilientPOS", status="CONFLICT"}[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 단말과 서버의 sync 상태가 갈라진 항목이 있다
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#syncconflict

      - alert: SyncGapPersistent
        # shortcut: 창 5분과 30분은 근거 없는 시작값이다. 단말 재전송 주기가 정해지면 조정한다.
        expr: sum(increase(sync_operation_total{application="ResilientPOS", status="GAP"}[5m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 앞 순번을 채우지 못한 sync 항목이 30분 넘게 계속 온다
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#syncgappersistent

      - alert: OwnerSessionStoreUnavailable
        # actuator 밖에서 503을 내는 곳은 점주 세션 저장소(Redis) 장애 처리와 운영자 경로(/admin)의 IdP·Kafka 브로커 장애 처리다. health는 DB가 DOWN이거나 기동·종료 중이면 503이라 뺀다.
        # 운영자 경로의 503도 이 규칙에 잡힌다. 어느 쪽인지는 ERROR 줄의 uri로 가른다(runbook).
        # 필터 단계의 503은 uri가 UNKNOWN이라 그대로 잡힌다. 점주 요청이 드물면 놓칠 수 있어 Redis 장애의 주 신호는 LockFailOpen(reason=error)이다.
        expr: sum(increase(http_server_requests_seconds_count{application="ResilientPOS", status="503", uri!~"/actuator/.*"}[2m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 점주 요청이 5분 넘게 503으로 실패한다
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#ownersessionstoreunavailable

      - alert: InboundStoreRateLimited
        # 매장 bucket 거절은 그 매장 단말 전부를 막는다. #77에서 한 매장 단말 4대가 함께 재연결해 backlog를 보내도 매장 거절은 없었으므로 이어지는 매장 거절은 정상 회복이 아니다.
        # 단말 bucket 거절은 오래 오프라인이던 단말의 정상 회복에도 이어지므로 보지 않는다. counter에 매장 ID가 없어 어느 매장인지는 거절 로그로 찾는다(runbook).
        # shortcut: 5분은 감지 지연으로 고른 시작값이다. 여러 매장이 번갈아 짧게 거절돼도 울릴 수 있다. 운영에서 그런 경보가 잦으면 다시 본다.
        expr: sum(increase(inbound_rate_limited_total{application="ResilientPOS", scope="store"}[2m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 매장 단위 빈도 상한 거절이 5분 넘게 이어진다
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#inboundstoreratelimited

      - alert: HttpLatencyAboveTarget
        # 목표는 원문 NFR(시스템 설계 §7)이다. 생성 200ms, PG 제외 결제 처리 150ms(승인은 Kafka 뒤), sync는 가장 큰 배치(500 op)의 2초다.
        # 429는 처리 없이 빨리 끝나 p95를 낮추므로 뺀다. 5분에 20건(1 ÷ (1 − 0.95)) 미만이면 요청 하나가 p95를 정하므로 판정하지 않는다.
        # for 10분은 창 5분에 #77의 가장 긴 정상 튐(단말 100대 동시 재연결 40초, 1분으로 올림)을 더한 6분보다 길다.
        expr: |
          (
            histogram_quantile(0.95, sum by (le, uri) (rate(http_server_requests_seconds_bucket{application="ResilientPOS", method="POST", uri="/v1/orders", status!="429"}[5m]))) > 0.2
            or
            histogram_quantile(0.95, sum by (le, uri) (rate(http_server_requests_seconds_bucket{application="ResilientPOS", method="POST", uri="/v1/orders/{orderId}/checkout", status!="429"}[5m]))) > 0.15
            or
            histogram_quantile(0.95, sum by (le, uri) (rate(http_server_requests_seconds_bucket{application="ResilientPOS", method="POST", uri="/v1/terminals/{terminalId}/sync", status!="429"}[5m]))) > 2
          )
          and on (uri)
          sum by (uri) (increase(http_server_requests_seconds_count{application="ResilientPOS", method="POST", status!="429"}[5m])) >= 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.uri }} 요청의 p95가 10분 넘게 원문 목표를 넘는다"
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#httplatencyabovetarget

      - alert: HttpErrorBudgetBurn
        # SLO는 원문 "주문 API 99.9%"를 단말 API(/v1)에 둔 것이고 예산 기간은 30일이다. 실패는 5xx이고 429(빈도 상한의 정상 거절)는 분모에서도 뺀다.
        # Google SRE Workbook "Alerting on SLOs"의 page 두 쌍이다. 1시간·5분 14.4배는 예산의 2%를 1시간에, 6시간·30분 6배는 5%를 6시간에 쓴 것이다.
        # 긴 창의 실패가 3건 미만이면 그 쌍을 판정하지 않는다(Workbook 저트래픽 절의 최소 실패 건수, 3에는 측정 근거가 없다). 짧은 창이 빨리 풀리게 하므로 for는 두지 않는다.
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{application="ResilientPOS", uri=~"/v1/.*", status=~"5.."}[1h]))
              / sum(rate(http_server_requests_seconds_count{application="ResilientPOS", uri=~"/v1/.*", status!="429"}[1h])) > 14.4 * 0.001
            and
            sum(rate(http_server_requests_seconds_count{application="ResilientPOS", uri=~"/v1/.*", status=~"5.."}[5m]))
              / sum(rate(http_server_requests_seconds_count{application="ResilientPOS", uri=~"/v1/.*", status!="429"}[5m])) > 14.4 * 0.001
            and
            sum(increase(http_server_requests_seconds_count{application="ResilientPOS", uri=~"/v1/.*", status=~"5.."}[1h])) >= 3
          )
          or
          (
            sum(rate(http_server_requests_seconds_count{application="ResilientPOS", uri=~"/v1/.*", status=~"5.."}[6h]))
              / sum(rate(http_server_requests_seconds_count{application="ResilientPOS", uri=~"/v1/.*", status!="429"}[6h])) > 6 * 0.001
            and
            sum(rate(http_server_requests_seconds_count{application="ResilientPOS", uri=~"/v1/.*", status=~"5.."}[30m]))
              / sum(rate(http_server_requests_seconds_count{application="ResilientPOS", uri=~"/v1/.*", status!="429"}[30m])) > 6 * 0.001
            and
            sum(increase(http_server_requests_seconds_count{application="ResilientPOS", uri=~"/v1/.*", status=~"5.."}[6h])) >= 3
          )
        labels:
          severity: critical
        annotations:
          summary: "단말 API(/v1)의 5xx가 오류 예산(가용성 99.9%)을 빠르게 쓰고 있다"
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#httperrorbudgetburn

      - alert: HttpErrorBudgetSlowBurn
        # Workbook의 ticket 쌍이다. 3일·6시간 창이 모두 배수 1(30일 예산의 10%를 3일에 씀)을 넘으면 운다. 분자와 분모는 HttpErrorBudgetBurn과 같다.
        # 3일 실패 수는 기록의 평균 rate에 3일을 곱한 어림값이라 2.5를 3건의 문턱으로 쓴다. 기록이 3일보다 짧게 쌓였거나 Prometheus가 멈춘 구간이 있으면 어긋난다.
        expr: |
          avg_over_time(resilientpos:http_v1_errors:rate5m[3d]) / avg_over_time(resilientpos:http_v1_requests:rate5m[3d]) > 1 * 0.001
          and
          sum(rate(http_server_requests_seconds_count{application="ResilientPOS", uri=~"/v1/.*", status=~"5.."}[6h]))
            / sum(rate(http_server_requests_seconds_count{application="ResilientPOS", uri=~"/v1/.*", status!="429"}[6h])) > 1 * 0.001
          and
          avg_over_time(resilientpos:http_v1_errors:rate5m[3d]) * 3 * 86400 > 2.5
        labels:
          severity: warning
        annotations:
          summary: "단말 API(/v1)의 5xx가 3일 동안 오류 예산(가용성 99.9%)을 기간보다 빠르게 쓰고 있다"
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#httperrorbudgetslowburn

      - alert: HealthProbeFailing
        # Alloy blackbox가 15초마다 /actuator/health(DB 포함, Redis 제외)를 부른다. 트래픽이 없을 때의 멈춤·무응답·DB 장애를 잡는다.
        # 1분 창의 probe가 모두 실패한 상태가 1분 이어져야 운다. 한 번의 timeout에는 울지 않고, 탐지까지 약 2~3분이 걸린다.
        expr: max_over_time(probe_success{application="ResilientPOS"}[1m]) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: ResilientPOS health probe가 2분 넘게 실패한다
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#healthprobefailing

      - alert: SyncConvergenceBudgetBurn
        # G-03(재연결 뒤 60초 안에 99.99% 확정, 예산 기간 30일)의 burn rate다. 60초를 넘긴 항목은 count와 le="60.0" bucket의 차이다.
        # HttpErrorBudgetBurn과 같은 두 쌍과 실패 3건 하한이다. 확정 시점에 기록하는 후행 지표라 장애가 끝난 뒤에 울어 warning이다.
        expr: |
          (
            1 - sum(rate(sync_convergence_seconds_bucket{application="ResilientPOS", le="60.0"}[1h]))
              / sum(rate(sync_convergence_seconds_count{application="ResilientPOS"}[1h])) > 14.4 * 0.0001
            and
            1 - sum(rate(sync_convergence_seconds_bucket{application="ResilientPOS", le="60.0"}[5m]))
              / sum(rate(sync_convergence_seconds_count{application="ResilientPOS"}[5m])) > 14.4 * 0.0001
            and
            sum(increase(sync_convergence_seconds_count{application="ResilientPOS"}[1h]))
              - sum(increase(sync_convergence_seconds_bucket{application="ResilientPOS", le="60.0"}[1h])) >= 3
          )
          or
          (
            1 - sum(rate(sync_convergence_seconds_bucket{application="ResilientPOS", le="60.0"}[6h]))
              / sum(rate(sync_convergence_seconds_count{application="ResilientPOS"}[6h])) > 6 * 0.0001
            and
            1 - sum(rate(sync_convergence_seconds_bucket{application="ResilientPOS", le="60.0"}[30m]))
              / sum(rate(sync_convergence_seconds_count{application="ResilientPOS"}[30m])) > 6 * 0.0001
            and
            sum(increase(sync_convergence_seconds_count{application="ResilientPOS"}[6h]))
              - sum(increase(sync_convergence_seconds_bucket{application="ResilientPOS", le="60.0"}[6h])) >= 3
          )
        labels:
          severity: warning
        annotations:
          summary: "재연결 뒤 60초 안에 확정되지 않은 sync 항목이 G-03 예산(99.99%)을 빠르게 쓰고 있다"
          runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#syncconvergencebudgetburn
