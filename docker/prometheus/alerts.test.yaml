        alertname: HttpErrorBudgetBurn
        exp_alerts: []

  - name: 1시간 창에는 2건이어도 6시간 창의 실패가 3건이면 6시간 쌍이 운다
    interval: 1m
    input_series:
      # 분에 1건이고 300·360·395분의 요청이 500이다. 400분의 1시간 창에는 2건이라 1시간 쌍은 하한에 막힌다.
      # 6시간 창은 3건(0.83%), 30분 창은 1건(3.3%)이다.
      - series: http_server_requests_seconds_count{application="ResilientPOS", method="POST", status="200", uri="/v1/terminals/{terminalId}/sync", instance="a"}
        values: 0+1x400
      - series: http_server_requests_seconds_count{application="ResilientPOS", method="POST", status="500", uri="/v1/terminals/{terminalId}/sync", instance="a"}
        values: 0x299 1x59 2x34 3x5
    alert_rule_test:
      - eval_time: 400m
        alertname: HttpErrorBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "단말 API(/v1)의 5xx가 오류 예산(가용성 99.9%)을 빠르게 쓰고 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#httperrorbudgetburn

  - name: 1시간 쌍은 1.5%에 운다
    interval: 1m
    input_series:
      # 6시간 동안 깨끗하다가 마지막 1시간만 1.5%가 500이다. 6시간 창은 0.25%라 6시간 쌍은 울지 않는다.
      - series: http_server_requests_seconds_count{application="ResilientPOS", method="POST", status="200", uri="/v1/terminals/{terminalId}/sync", instance="a"}
        values: 0+6000x360 2165910+5910x59
      - series: http_server_requests_seconds_count{application="ResilientPOS", method="POST", status="500", uri="/v1/terminals/{terminalId}/sync", instance="a"}
        values: 0x360 90+90x59
    alert_rule_test:
