      - series: http_server_requests_seconds_count{application="ResilientPOS", method="POST", status="200", uri="/v1/terminals/{terminalId}/sync", instance="a"}
        values: 0+999.15x3960 3957632+998x359
      - series: http_server_requests_seconds_count{application="ResilientPOS", method="POST", status="500", uri="/v1/terminals/{terminalId}/sync", instance="a"}
        values: 0+0.85x3960 3368+2x359
      # 실패로 세지 않는 409와 /v1 밖 500이다. 3일 기록에 섞으면 0.14%가 된다.
      - series: http_server_requests_seconds_count{application="ResilientPOS", method="POST", status="409", uri="/v1/orders", instance="a"}
        values: 0+0.5x4320
      - series: http_server_requests_seconds_count{application="ResilientPOS", method="POST", status="500", uri="/owner/v1/login", instance="a"}
        values: 0+0.5x4320
    alert_rule_test:
      - eval_time: 4320m
        alertname: HttpErrorBudgetSlowBurn
        exp_alerts: []

  - name: 느린 소진은 3일 창의 실패가 2건이면 울지 않는다
    interval: 1m
    input_series:
      # 분에 0.4건(3일 1,728건)이다. 4,300·4,310분의 실패 2건은 3일 창 0.116%, 6시간 창 1.37%라 하한이 없으면 운다.
      - series: http_server_requests_seconds_count{application="ResilientPOS", method="POST", status="200", uri="/v1/terminals/{terminalId}/sync", instance="a"}
        values: 0+0.4x4320
      - series: http_server_requests_seconds_count{application="ResilientPOS", method="POST", status="500", uri="/v1/terminals/{terminalId}/sync", instance="a"}
        values: 0x4299 1x9 2x10
    alert_rule_test:
      - eval_time: 4320m
        alertname: HttpErrorBudgetSlowBurn
        exp_alerts: []

  - name: 느린 소진은 3일 창의 실패가 3건이면 운다
    interval: 1m
    input_series:
      - series: http_server_requests_seconds_count{application="ResilientPOS", method="POST", status="200", uri="/v1/terminals/{terminalId}/sync", instance="a"}
        values: 0+0.4x4320
      - series: http_server_requests_seconds_count{application="ResilientPOS", method="POST", status="500", uri="/v1/terminals/{terminalId}/sync", instance="a"}
        values: 0x4299 1x9 2x4 3x5
    alert_rule_test:
      - eval_time: 4320m
        alertname: HttpErrorBudgetSlowBurn
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "단말 API(/v1)의 5xx가 3일 동안 오류 예산(가용성 99.9%)을 기간보다 빠르게 쓰고 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#httperrorbudgetslowburn

  - name: 기록이 3일보다 짧으면 실패를 그 기록만큼만 센다
    interval: 1m
    input_series:
      # 스택을 다시 만든 지 10시간이다. 분에 0.4건이고 300분에 1건, 501·512분에 1건씩 실패한다.
      # 450분에는 3일 비율 0.56%, 6시간 비율 0.69%다. 평균 rate에 3일을 곱하면 실패 1건이 9.6건이 되어 운다.
      - series: http_server_requests_seconds_count{application="ResilientPOS", method="POST", status="200", uri="/v1/terminals/{terminalId}/sync", instance="a"}
        values: 0+0.4x602
      - series: http_server_requests_seconds_count{application="ResilientPOS", method="POST", status="500", uri="/v1/terminals/{terminalId}/sync", instance="a"}
        values: 0x299 1x200 2x10 3x90
    alert_rule_test:
      - eval_time: 450m
        alertname: HttpErrorBudgetSlowBurn
        exp_alerts: []
      - eval_time: 600m
        alertname: HttpErrorBudgetSlowBurn
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "단말 API(/v1)의 5xx가 3일 동안 오류 예산(가용성 99.9%)을 기간보다 빠르게 쓰고 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#httperrorbudgetslowburn

  # probe는 Alloy가 15초마다 부른다.
  - name: health probe가 1분 넘게 모두 실패한 상태가 1분 이어지면 울고 성공하면 풀린다
    interval: 15s
    input_series:
      # 5분부터 15분 직전까지 실패한다. 6분에 1분 창이 모두 실패라 pending, 7분에 firing이다.
      - series: probe_success{application="ResilientPOS"}
        values: 1x19 0x39 1x40
    alert_rule_test:
      - eval_time: 6m
        alertname: HealthProbeFailing
        exp_alerts: []
      - eval_time: 7m
        alertname: HealthProbeFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              application: ResilientPOS
            exp_annotations:
              summary: "ResilientPOS health probe가 2분 넘게 실패한다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#healthprobefailing
      - eval_time: 16m
        alertname: HealthProbeFailing
        exp_alerts: []

  - name: 한 번 실패하거나 1분 안에 회복한 probe는 울지 않는다
    interval: 15s
    input_series:
      # 3분에 한 번 실패한다(GC, 호스트 부하). 5분 15초부터 6분 30초까지 실패해 6분에 pending이 되고, 7분에는 1분 창에 성공이 들어와 풀린다.
      - series: probe_success{application="ResilientPOS"}
        values: 1x11 0 1x7 0x5 1x40
    alert_rule_test:
      - eval_time: 4m
        alertname: HealthProbeFailing
        exp_alerts: []
      - eval_time: 7m
        alertname: HealthProbeFailing
        exp_alerts: []
      - eval_time: 8m
        alertname: HealthProbeFailing
        exp_alerts: []

  # G-03 시나리오는 처음 확정된 항목이 분에 6,000건이다. 60초를 넘긴 항목은 count와 le="60.0" bucket의 차이다.
  - name: 재연결 뒤 60초를 넘긴 항목이 1시간 쌍의 배수를 넘으면 울고 30분 창이 깨끗해지면 풀린다
    interval: 1m
    input_series:
      # 70분까지 항목의 0.2%(분에 12건)가 60초와 300초 사이다. 85분에는 5분 창이 깨끗하지만 30분 창이 0.1%라 6시간 쌍이 붙잡는다.
      - series: sync_convergence_seconds_count{application="ResilientPOS", instance="a"}
        values: 0+6000x110
      - series: sync_convergence_seconds_bucket{application="ResilientPOS", instance="a", le="60.0"}
        values: 0+5988x70 425160+6000x39
      # 다른 bucket을 고르면 결과가 달라진다. 300초 bucket에는 모두 들고, 10초 bucket에는 1%가 빠진다.
      - series: sync_convergence_seconds_bucket{application="ResilientPOS", instance="a", le="300.0"}
        values: 0+6000x110
      - series: sync_convergence_seconds_bucket{application="ResilientPOS", instance="a", le="10.0"}
        values: 0+5940x110
    alert_rule_test:
      - eval_time: 30m
        alertname: SyncConvergenceBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "재연결 뒤 60초 안에 확정되지 않은 sync 항목이 G-03 예산(99.99%)을 빠르게 쓰고 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#syncconvergencebudgetburn
      - eval_time: 85m
        alertname: SyncConvergenceBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "재연결 뒤 60초 안에 확정되지 않은 sync 항목이 G-03 예산(99.99%)을 빠르게 쓰고 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#syncconvergencebudgetburn
      - eval_time: 101m
        alertname: SyncConvergenceBudgetBurn
        exp_alerts: []

  - name: G-03 1시간 쌍은 0.15%에 운다
    interval: 1m
    input_series:
      # 6시간 동안 깨끗하다가 마지막 1시간만 0.15%가 60초를 넘는다. 6시간 창은 0.025%라 6시간 쌍은 울지 않는다.
      - series: sync_convergence_seconds_count{application="ResilientPOS", instance="a"}
        values: 0+6000x420
      - series: sync_convergence_seconds_bucket{application="ResilientPOS", instance="a", le="60.0"}
        values: 0+6000x360 2165991+5991x59
    alert_rule_test:
      - eval_time: 420m
        alertname: SyncConvergenceBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "재연결 뒤 60초 안에 확정되지 않은 sync 항목이 G-03 예산(99.99%)을 빠르게 쓰고 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#syncconvergencebudgetburn

  - name: G-03 1시간 쌍은 0.14%에 울지 않는다
    interval: 1m
    input_series:
      - series: sync_convergence_seconds_count{application="ResilientPOS", instance="a"}
        values: 0+6000x420
      - series: sync_convergence_seconds_bucket{application="ResilientPOS", instance="a", le="60.0"}
        values: 0+6000x360 2165991.6+5991.6x59
      # 10초 bucket을 고르면 1%가 넘는다.
      - series: sync_convergence_seconds_bucket{application="ResilientPOS", instance="a", le="10.0"}
        values: 0+5940x420
    alert_rule_test:
      - eval_time: 420m
        alertname: SyncConvergenceBudgetBurn
        exp_alerts: []

  - name: G-03 6시간 쌍은 0.065%에 운다
    interval: 1m
    input_series:
      # 처음부터 0.065%가 60초를 넘는다. 0.144% 아래라 1시간 쌍은 울지 않는다.
      - series: sync_convergence_seconds_count{application="ResilientPOS", instance="a"}
        values: 0+6000x40
      - series: sync_convergence_seconds_bucket{application="ResilientPOS", instance="a", le="60.0"}
        values: 0+5996.1x40
    alert_rule_test:
      - eval_time: 40m
        alertname: SyncConvergenceBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "재연결 뒤 60초 안에 확정되지 않은 sync 항목이 G-03 예산(99.99%)을 빠르게 쓰고 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#syncconvergencebudgetburn

  - name: G-03 6시간 쌍은 0.055%에 울지 않는다
    interval: 1m
    input_series:
      - series: sync_convergence_seconds_count{application="ResilientPOS", instance="a"}
        values: 0+6000x40
      - series: sync_convergence_seconds_bucket{application="ResilientPOS", instance="a", le="60.0"}
        values: 0+5996.7x40
    alert_rule_test:
      - eval_time: 40m
        alertname: SyncConvergenceBudgetBurn
        exp_alerts: []

  - name: 60초를 넘긴 항목이 2건이면 G-03이 울지 않는다
    interval: 1m
    input_series:
      # 분에 1건이 확정되고 62·63분의 항목이 60초를 넘는다. 1시간 창 3.3%라 하한이 없으면 운다.
      - series: sync_convergence_seconds_count{application="ResilientPOS", instance="a"}
        values: 0+1x65
      - series: sync_convergence_seconds_bucket{application="ResilientPOS", instance="a", le="60.0"}
        values: 0+1x61 61 61 62 63
    alert_rule_test:
      - eval_time: 65m
        alertname: SyncConvergenceBudgetBurn
        exp_alerts: []

  - name: 60초를 넘긴 항목이 3건이면 G-03이 운다
    interval: 1m
    input_series:
      - series: sync_convergence_seconds_count{application="ResilientPOS", instance="a"}
        values: 0+1x65
      - series: sync_convergence_seconds_bucket{application="ResilientPOS", instance="a", le="60.0"}
        values: 0+1x61 61 61 61 62
    alert_rule_test:
      - eval_time: 65m
        alertname: SyncConvergenceBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "재연결 뒤 60초 안에 확정되지 않은 sync 항목이 G-03 예산(99.99%)을 빠르게 쓰고 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#syncconvergencebudgetburn
