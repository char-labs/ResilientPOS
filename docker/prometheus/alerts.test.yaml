# alerts.yaml의 promtool 단위 테스트. AlertRulesTest가 ./gradlew test에서 돌린다.
# 직접 돌리기: docker run --rm -v "$PWD/docker/prometheus:/rules:ro" --entrypoint promtool prom/prometheus:v3.15.0 test rules /rules/alerts.test.yaml
# 값 표기: a+bxn은 a부터 b씩 n번 더한 n+1개, _xn은 빈 값 n개다.
rule_files:
  - alerts.yaml

evaluation_interval: 1m

tests:
  - name: 앱 metric이 모두 사라지면 5분 뒤 울린다
    interval: 1m
    input_series:
      - series: process_uptime_seconds{application="ResilientPOS", instance="a"}
        values: 0+60x10
    alert_rule_test:
      - eval_time: 9m
        alertname: ResilientPosMetricsAbsent
        exp_alerts: []
      # 마지막 표본(10분) 뒤 lookback 5분이 지나야 사라지고, 다시 for 5분이다.
      - eval_time: 18m
        alertname: ResilientPosMetricsAbsent
        exp_alerts: []
      - eval_time: 22m
        alertname: ResilientPosMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              application: ResilientPOS
            exp_annotations:
              summary: "ResilientPOS 인스턴스의 metric이 5분 넘게 보이지 않는다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#resilientposmetricsabsent

  - name: 가장 오래된 미완료 발행 기록이 1시간을 넘으면 울리고 끝나면 풀린다
    interval: 1m
    input_series:
      # 재전송 중이라 failed 개수가 0과 1을 오가도 경과 시간은 계속 는다. b는 정상 인스턴스다.
      - series: event_publication_incomplete_oldest_seconds{application="ResilientPOS", instance="a"}
        values: 0+60x70 0x10
      - series: event_publication_incomplete_oldest_seconds{application="ResilientPOS", instance="b"}
        values: 0x80
    alert_rule_test:
      - eval_time: 64m
        alertname: EventPublicationOverdue
        exp_alerts: []
      - eval_time: 67m
        alertname: EventPublicationOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "1시간 넘게 나가지 못한 발행 기록이 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#eventpublicationoverdue
      - eval_time: 75m
        alertname: EventPublicationOverdue
        exp_alerts: []

  - name: 세지 못한 인스턴스의 NaN은 경과 시간 알림을 붙잡지 않는다
    interval: 1m
    input_series:
      - series: event_publication_incomplete_oldest_seconds{application="ResilientPOS", instance="a"}
        values: NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN
      - series: event_publication_incomplete_oldest_seconds{application="ResilientPOS", instance="b"}
        values: 0x80
    alert_rule_test:
      - eval_time: 70m
        alertname: EventPublicationOverdue
        exp_alerts: []

  - name: 신선도는 갱신이 멈춘 인스턴스만 울린다
    interval: 1m
    input_series:
      # promtool의 시각은 0초에서 시작한다. 1분마다 갱신하는 인스턴스는 값이 시각을 따라간다.
      - series: event_publication_incomplete_refreshed_seconds{application="ResilientPOS", instance="fresh"}
        values: 0+60x40
      - series: event_publication_incomplete_refreshed_seconds{application="ResilientPOS", instance="stuck"}
        values: 0+60x10 600x30
      # 기동 직후 첫 갱신 전에는 0이다. 2분 뒤 갱신되면 for 5분을 채우지 못해 울리지 않는다.
      - series: event_publication_incomplete_refreshed_seconds{application="ResilientPOS", instance="booting"}
        values: _x18 0 0 1200+60x20
    alert_rule_test:
      - eval_time: 14m
        alertname: EventPublicationMetricStale
        exp_alerts: []
      - eval_time: 22m
        alertname: EventPublicationMetricStale
        exp_alerts:
          - exp_labels:
              severity: warning
              application: ResilientPOS
              instance: stuck
            exp_annotations:
              summary: "stuck 인스턴스가 발행 기록을 5분 넘게 세지 못했다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#eventpublicationmetricstale

  - name: 처리하지 않은 DLT가 있는 동안 울리고 처리하면 다음 평가에 풀린다
    interval: 1m
    input_series:
      # 첫 갱신 전에는 NaN이다. 6분에 DLT가 하나 생기고 17분에 재투입이나 폐기로 처리된다.
      - series: event_kafka_dead_letter_unhandled{application="ResilientPOS", topic="order.paid", instance="a"}
        values: NaN 0x4 1x10 0x10
      - series: event_kafka_dead_letter_unhandled{application="ResilientPOS", topic="payment.approved", instance="a"}
        values: NaN 0x25
    alert_rule_test:
      - eval_time: 4m
        alertname: KafkaDeadLetter
        exp_alerts: []
      - eval_time: 6m
        alertname: KafkaDeadLetter
        exp_alerts:
          - exp_labels:
              severity: critical
              topic: order.paid
            exp_annotations:
              summary: "order.paid의 DLT에 처리하지 않은 메시지가 1건 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#kafkadeadletter
      # 늘지 않아도 남아 있는 동안은 계속 울린다.
      - eval_time: 14m
        alertname: KafkaDeadLetter
        exp_alerts:
          - exp_labels:
              severity: critical
              topic: order.paid
            exp_annotations:
              summary: "order.paid의 DLT에 처리하지 않은 메시지가 1건 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#kafkadeadletter
      - eval_time: 17m
        alertname: KafkaDeadLetter
        exp_alerts: []

  - name: 미처리 DLT는 pod 사이를 max로 묶고 첫 갱신 전 NaN은 빠진다
    interval: 1m
    input_series:
      - series: event_kafka_dead_letter_unhandled{application="ResilientPOS", topic="payment.approved", instance="a"}
        values: 2x20
      # 막 뜬 pod다. 첫 갱신 전 NaN이 값이 있는 pod의 알림을 끊지 않는다. 그 뒤 값이 갈리면 큰 쪽을 낸다.
      - series: event_kafka_dead_letter_unhandled{application="ResilientPOS", topic="payment.approved", instance="b"}
        values: _x5 NaN NaN 1x13
    alert_rule_test:
      - eval_time: 6m
        alertname: KafkaDeadLetter
        exp_alerts:
          - exp_labels:
              severity: critical
              topic: payment.approved
            exp_annotations:
              summary: "payment.approved의 DLT에 처리하지 않은 메시지가 2건 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#kafkadeadletter
      - eval_time: 10m
        alertname: KafkaDeadLetter
        exp_alerts:
          - exp_labels:
              severity: critical
              topic: payment.approved
            exp_annotations:
              summary: "payment.approved의 DLT에 처리하지 않은 메시지가 2건 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#kafkadeadletter

  - name: 다른 pod가 세고 있으면 갱신이 멈춘 pod의 옛 값은 DLT 알림을 붙잡지 않는다
    interval: 1m
    input_series:
      # a는 5분까지 세고 멈춰 1에 머문다(마지막 값 유지). b는 계속 센다. 1건은 3분에 처리됐다.
      - series: event_kafka_dead_letter_unhandled{application="ResilientPOS", topic="order.paid", instance="a"}
        values: 1x20
      - series: event_kafka_dead_letter_unhandled_refreshed_seconds{application="ResilientPOS", instance="a"}
        values: 0+60x5 300x15
      - series: event_kafka_dead_letter_unhandled{application="ResilientPOS", topic="order.paid", instance="b"}
        values: 1 1 1 0x17
      - series: event_kafka_dead_letter_unhandled_refreshed_seconds{application="ResilientPOS", instance="b"}
        values: 0+60x20
    alert_rule_test:
      # a는 아직 신선해 옛 값 1이 max를 붙잡는다.
      - eval_time: 6m
        alertname: KafkaDeadLetter
        exp_alerts:
          - exp_labels:
              severity: critical
              topic: order.paid
            exp_annotations:
              summary: "order.paid의 DLT에 처리하지 않은 메시지가 1건 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#kafkadeadletter
      # 마지막 성공이 5분을 넘으면(10분) a는 빠지고 b의 0만 본다.
      - eval_time: 11m
        alertname: KafkaDeadLetter
        exp_alerts: []

  - name: 모든 pod가 세지 못하면 마지막 값으로 DLT 알림을 유지한다
    interval: 1m
    input_series:
      # 브로커 장애로 두 pod 모두 5분부터 세지 못한다. 그동안 새 DLT도 처리도 일어날 수 없어 마지막 값이 맞다.
      - series: event_kafka_dead_letter_unhandled{application="ResilientPOS", topic="order.paid", instance="a"}
        values: 1x30
      - series: event_kafka_dead_letter_unhandled_refreshed_seconds{application="ResilientPOS", instance="a"}
        values: 0+60x5 300x25
      - series: event_kafka_dead_letter_unhandled{application="ResilientPOS", topic="order.paid", instance="b"}
        values: 1x30
      - series: event_kafka_dead_letter_unhandled_refreshed_seconds{application="ResilientPOS", instance="b"}
        values: 0+60x5 300x25
    alert_rule_test:
      - eval_time: 25m
        alertname: KafkaDeadLetter
        exp_alerts:
          - exp_labels:
              severity: critical
              topic: order.paid
            exp_annotations:
              summary: "order.paid의 DLT에 처리하지 않은 메시지가 1건 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#kafkadeadletter

  - name: DLT 전송 실패는 첫 scrape 전에 오른 값도 잡고 멈추면 하루 붙잡지 않는다
    interval: 1m
    input_series:
      - series: event_kafka_dead_letter_failed_total{application="ResilientPOS", topic="order.paid", instance="a"}
        values: 0x30
      - series: event_kafka_dead_letter_failed_total{application="ResilientPOS", topic="payment.approved", instance="b"}
        values: _x5 2x25
    alert_rule_test:
      - eval_time: 7m
        alertname: KafkaDeadLetterPublishFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              topic: payment.approved
            exp_annotations:
              summary: "payment.approved 메시지를 DLT로 보내지 못해 같은 메시지를 다시 처리하고 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#kafkadeadletterpublishfailed
      # 전송이 다시 되면 메시지는 DLT로 가서 KafkaDeadLetter가 잡는다. 증가가 멈추면 감지 창(10분) 뒤 풀린다.
      - eval_time: 20m
        alertname: KafkaDeadLetterPublishFailed
        exp_alerts: []

  - name: consumer lag는 점이 있는 토픽 이름으로 한 번만 울린다
    interval: 1m
    input_series:
      - series: kafka_consumer_fetch_manager_records_lag{application="ResilientPOS", topic="order.paid", partition="0", client_id="consumer-fulfillment.order-paid-10"}
        values: 2000x20
      - series: kafka_consumer_fetch_manager_records_lag{application="ResilientPOS", topic="order_paid", partition="0", client_id="consumer-fulfillment.order-paid-10"}
        values: 2000x20
      - series: kafka_consumer_fetch_manager_records_lag{application="ResilientPOS", topic="payment.approved", partition="1", client_id="consumer-order.payment-approved-13"}
        values: 10x20
    alert_rule_test:
      - eval_time: 9m
        alertname: KafkaConsumerLag
        exp_alerts: []
      - eval_time: 11m
        alertname: KafkaConsumerLag
        exp_alerts:
          - exp_labels:
              severity: warning
              topic: order.paid
              partition: "0"
            exp_annotations:
              summary: "order.paid 파티션 0의 consumer lag가 10분 넘게 1000을 넘는다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#kafkaconsumerlag

  - name: 기동한 뒤 한 번도 성공하지 못한 재전송 작업도 울리고 성공하는 인스턴스는 조용하다
    interval: 1m
    input_series:
      - series: process_uptime_seconds{application="ResilientPOS", instance="never"}
        values: 0+60x40
      - series: process_uptime_seconds{application="ResilientPOS", instance="healthy"}
        values: 0+60x40
      - series: tasks_scheduled_execution_seconds_count{application="ResilientPOS", instance="healthy", code_function="resubmitAndPurge", code_namespace="com.resilientpos.platform.EventPublicationResubmitter", outcome="SUCCESS", exception="none", error="none"}
        values: _ 1+1x39
      # 다른 작업의 성공은 재전송 작업의 생존이 아니다.
      - series: tasks_scheduled_execution_seconds_count{application="ResilientPOS", instance="never", code_function="resolveUnknown", code_namespace="com.resilientpos.payment.internal.application.UnknownPaymentResolver", outcome="SUCCESS", exception="none", error="none"}
        values: _ 1+1x39
    alert_rule_test:
      - eval_time: 14m
        alertname: EventPublicationResubmitterNotSucceeding
        exp_alerts: []
      - eval_time: 17m
        alertname: EventPublicationResubmitterNotSucceeding
        exp_alerts:
          - exp_labels:
              severity: warning
              application: ResilientPOS
              instance: never
            exp_annotations:
              summary: "never의 발행 기록 재전송 작업이 20분 넘게 성공하지 못했다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#eventpublicationresubmitternotsucceeding

  - name: 성공이 멈춘 결과 불명 확정 작업은 20분 안팎에 울린다
    interval: 1m
    input_series:
      - series: process_uptime_seconds{application="ResilientPOS", instance="a"}
        values: 0+60x60
      - series: tasks_scheduled_execution_seconds_count{application="ResilientPOS", instance="a", code_function="resolveUnknown", code_namespace="com.resilientpos.payment.internal.application.UnknownPaymentResolver", outcome="SUCCESS", exception="none", error="none"}
        values: _ 1+1x19 20x40
    alert_rule_test:
      - eval_time: 25m
        alertname: UnknownPaymentResolverNotSucceeding
        exp_alerts: []
      - eval_time: 42m
        alertname: UnknownPaymentResolverNotSucceeding
        exp_alerts:
          - exp_labels:
              severity: warning
              application: ResilientPOS
              instance: a
            exp_annotations:
              summary: "a의 결과 불명 결제 확정 작업이 20분 넘게 성공하지 못했다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#unknownpaymentresolvernotsucceeding

  - name: 미처리 DLT 갱신 작업이 한 번도 성공하지 못하면 울린다
    interval: 1m
    input_series:
      - series: process_uptime_seconds{application="ResilientPOS", instance="denied"}
        values: 0+60x40
      - series: process_uptime_seconds{application="ResilientPOS", instance="healthy"}
        values: 0+60x40
      # 기동하자마자 돌고 1분마다 성공한다.
      - series: tasks_scheduled_execution_seconds_count{application="ResilientPOS", instance="healthy", code_function="countUnhandled", code_namespace="com.resilientpos.platform.deadletter.UnhandledDeadLetterMetrics", outcome="SUCCESS", exception="none", error="none"}
        values: 1+1x40
      # 운영 ACL에 DLT Describe가 빠진 인스턴스다. 매번 실패해 SUCCESS series가 없다.
      - series: tasks_scheduled_execution_seconds_count{application="ResilientPOS", instance="denied", code_function="countUnhandled", code_namespace="com.resilientpos.platform.deadletter.UnhandledDeadLetterMetrics", outcome="ERROR", exception="TopicAuthorizationException", error="TopicAuthorizationException"}
        values: 1+1x40
    alert_rule_test:
      - eval_time: 14m
        alertname: KafkaDeadLetterMetricNotSucceeding
        exp_alerts: []
      - eval_time: 17m
        alertname: KafkaDeadLetterMetricNotSucceeding
        exp_alerts:
          - exp_labels:
              severity: warning
              application: ResilientPOS
              instance: denied
            exp_annotations:
              summary: "denied의 미처리 DLT 갱신 작업이 20분 넘게 성공하지 못했다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#kafkadeadlettermetricnotsucceeding

  - name: 넘기지 않은 결과 불명의 경과 시간이 2시간을 넘으면 5분 뒤 울린다
    # 샘플 간격이 lookback(5분)보다 길면 series가 중간에 비어 for가 다시 센다. 실제 scrape 간격(15초)에 가깝게 1분으로 둔다.
    interval: 1m
    input_series:
      # 4분에 7240초가 되어 2시간을 넘는다. 모든 인스턴스가 같은 DB를 세므로 b도 같은 값이다.
      - series: payment_attempt_resolution_oldest_seconds{application="ResilientPOS", instance="a"}
        values: 7000+60x20
      - series: payment_attempt_resolution_oldest_seconds{application="ResilientPOS", instance="b"}
        values: 7000+60x20
    alert_rule_test:
      - eval_time: 8m
        alertname: UnknownPaymentResolutionStuck
        exp_alerts: []
      # 4분에 처음 참이 되고 정확히 5분 뒤에 firing이다.
      - eval_time: 9m
        alertname: UnknownPaymentResolutionStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "넘기지 않은 결과 불명 결제가 2시간 넘게 남아 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#unknownpaymentresolutionstuck

  - name: 여러 pod면 한 pod가 재기동해도 결과 불명 알림이 끊기지 않는다
    interval: 1m
    input_series:
      - series: payment_attempt_resolution_oldest_seconds{application="ResilientPOS", instance="a"}
        values: 9000+60x40
      # b가 21분에 내려가고(stale) 새로 떠서 첫 갱신 전 NaN을 낸 뒤 경과 시간을 다시 낸다.
      - series: payment_attempt_resolution_oldest_seconds{application="ResilientPOS", instance="b"}
        values: 9000+60x20 stale NaN NaN 10440+60x16
    alert_rule_test:
      - eval_time: 22m
        alertname: UnknownPaymentResolutionStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "넘기지 않은 결과 불명 결제가 2시간 넘게 남아 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#unknownpaymentresolutionstuck

  - name: 넘긴 결과 불명의 경과 시간이 24시간을 넘으면 5분 뒤 울린다
    interval: 1m
    input_series:
      # 7분에 86420초가 되어 24시간을 넘는다.
      - series: payment_attempt_reconciliation_pending_oldest_seconds{application="ResilientPOS", instance="a"}
        values: 86000+60x20
      # 넘기지 않은 쪽은 젊다. 해소 지연과 확정 지연은 따로 운다.
      - series: payment_attempt_resolution_oldest_seconds{application="ResilientPOS", instance="a"}
        values: 600+60x20
    alert_rule_test:
      - eval_time: 11m
        alertname: ReconciliationPendingUnresolved
        exp_alerts: []
      - eval_time: 13m
        alertname: ReconciliationPendingUnresolved
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "reconciliation으로 넘긴 결과 불명 결제가 24시간 넘게 해소되지 않았다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#reconciliationpendingunresolved
      - eval_time: 13m
        alertname: UnknownPaymentResolutionStuck
        exp_alerts: []

  - name: 한 pod가 재기동하면 해소 지연 알림은 풀렸다가 첫 갱신 뒤 5분에 다시 울린다
    interval: 1m
    input_series:
      # 31분에 내려가고(stale) 새 pod가 첫 갱신 전 2분 동안 NaN을 낸 뒤 34분부터 DB에서 다시 센 경과 시간을 낸다. 24시간을 처음부터 세지 않는다.
      - series: payment_attempt_reconciliation_pending_oldest_seconds{application="ResilientPOS", instance="a"}
        values: 90000+60x30 stale NaN NaN 92040+60x20
    alert_rule_test:
      - eval_time: 30m
        alertname: ReconciliationPendingUnresolved
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "reconciliation으로 넘긴 결과 불명 결제가 24시간 넘게 해소되지 않았다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#reconciliationpendingunresolved
      - eval_time: 33m
        alertname: ReconciliationPendingUnresolved
        exp_alerts: []
      - eval_time: 38m
        alertname: ReconciliationPendingUnresolved
        exp_alerts: []
      - eval_time: 39m
        alertname: ReconciliationPendingUnresolved
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "reconciliation으로 넘긴 결과 불명 결제가 24시간 넘게 해소되지 않았다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#reconciliationpendingunresolved

  - name: 락 fail-open은 이어질 때만 울린다
    interval: 1m
    input_series:
      # 처음 fail-open될 때 생기므로 첫 값이 1이다.
      - series: lock_fail_open_total{application="ResilientPOS", lock="order:create-lock", reason="error", instance="a"}
        values: 1+1x30
      - series: lock_fail_open_total{application="ResilientPOS", lock="platform:event-publication", reason="timeout", instance="a"}
        values: _x3 1 2x26
      # 1~2분짜리 Redis 장애: 세 번 오르고 멈춘다. 회복한 뒤에 울리면 안 된다.
      - series: lock_fail_open_total{application="ResilientPOS", lock="payment:unknown-resolve", reason="error", instance="a"}
        values: 1 2 3 3x27
    alert_rule_test:
      - eval_time: 15m
        alertname: LockFailOpen
        exp_alerts:
          - exp_labels:
              severity: warning
              lock: order:create-lock
              reason: error
            exp_annotations:
              summary: "order:create-lock 락이 10분 넘게 잠그지 못하고 진행한다(reason=error)"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#lockfailopen

  - name: 주기 작업 락의 대기 초과는 이어져도 울지 않고 Redis 오류와 업무 락의 대기 초과는 운다
    interval: 1m
    input_series:
      # pod가 여럿이면 늦은 pod는 앞 pod의 긴 블록을 기다리다 매분 대기 한도(1.5초)를 넘긴다. 정상이다.
      - series: lock_fail_open_total{application="ResilientPOS", lock="platform:event-publication", reason="timeout", instance="b"}
        values: 1+1x30
      - series: lock_fail_open_total{application="ResilientPOS", lock="payment:unknown-resolve", reason="timeout", instance="b"}
        values: 1+1x30
      - series: lock_fail_open_total{application="ResilientPOS", lock="payment:unknown-resolve", reason="error", instance="a"}
        values: 1+1x30
      - series: lock_fail_open_total{application="ResilientPOS", lock="payment:checkout-lock", reason="timeout", instance="a"}
        values: 1+1x30
    alert_rule_test:
      - eval_time: 15m
        alertname: LockFailOpen
        exp_alerts:
          - exp_labels:
              severity: warning
              lock: payment:unknown-resolve
              reason: error
            exp_annotations:
              summary: "payment:unknown-resolve 락이 10분 넘게 잠그지 못하고 진행한다(reason=error)"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#lockfailopen
          - exp_labels:
              severity: warning
              lock: payment:checkout-lock
              reason: timeout
            exp_annotations:
              summary: "payment:checkout-lock 락이 10분 넘게 잠그지 못하고 진행한다(reason=timeout)"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#lockfailopen

  - name: sync 충돌은 처음 생기자마자 울린다
    interval: 1m
    input_series:
      - series: sync_operation_total{application="ResilientPOS", status="CONFLICT", instance="a"}
        values: 0 0 1x20
      - series: sync_operation_total{application="ResilientPOS", status="APPLIED", instance="a"}
        values: 0+5x20
    alert_rule_test:
      - eval_time: 1m
        alertname: SyncConflict
        exp_alerts: []
      - eval_time: 3m
        alertname: SyncConflict
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "단말과 서버의 sync 상태가 갈라진 항목이 있다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#syncconflict
      - eval_time: 14m
        alertname: SyncConflict
        exp_alerts: []

  - name: sync gap은 30분 넘게 계속될 때만 울린다
    interval: 1m
    input_series:
      - series: sync_operation_total{application="ResilientPOS", status="GAP", instance="a"}
        values: 0+1x70
      - series: sync_operation_total{application="ResilientPOS", status="GAP", instance="b"}
        values: 0 1x70
    alert_rule_test:
      - eval_time: 25m
        alertname: SyncGapPersistent
        exp_alerts: []
      - eval_time: 62m
        alertname: SyncGapPersistent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "앞 순번을 채우지 못한 sync 항목이 30분 넘게 계속 온다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#syncgappersistent

  - name: 몇 분 간격의 gap 두 번은 울리지 않는다
    interval: 1m
    input_series:
      - series: sync_operation_total{application="ResilientPOS", status="GAP", instance="a"}
        values: 0 1 1 2 2x60
    alert_rule_test:
      - eval_time: 35m
        alertname: SyncGapPersistent
        exp_alerts: []

  - name: 점주 세션 저장소 503은 5분 넘게 이어지면 울린다
    interval: 1m
    input_series:
      - series: http_server_requests_seconds_count{application="ResilientPOS", status="503", uri="UNKNOWN", instance="a"}
        values: 1+3x20
      - series: http_server_requests_seconds_count{application="ResilientPOS", status="200", uri="/v1/orders", instance="a"}
        values: 0+10x20
      # health는 DB가 DOWN이거나 기동·종료 중이면 503이다. 세션 저장소 장애가 아니다.
      - series: http_server_requests_seconds_count{application="ResilientPOS", status="503", uri="/actuator/health", instance="b"}
        values: 0+3x20
    alert_rule_test:
      - eval_time: 3m
        alertname: OwnerSessionStoreUnavailable
        exp_alerts: []
      - eval_time: 8m
        alertname: OwnerSessionStoreUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "점주 요청이 5분 넘게 503으로 실패한다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#ownersessionstoreunavailable

  - name: 짧은 503 묶음과 health의 503은 울리지 않는다
    interval: 1m
    input_series:
      - series: http_server_requests_seconds_count{application="ResilientPOS", status="503", uri="UNKNOWN", instance="a"}
        values: 0 0 1 2 3 3x20
      - series: http_server_requests_seconds_count{application="ResilientPOS", status="503", uri="/actuator/health", instance="a"}
        values: 0+3x20
    alert_rule_test:
      - eval_time: 7m
        alertname: OwnerSessionStoreUnavailable
        exp_alerts: []
      - eval_time: 15m
        alertname: OwnerSessionStoreUnavailable
        exp_alerts: []

  - name: 매장 bucket 거절이 5분 넘게 이어지면 울린다
    interval: 1m
    input_series:
      - series: inbound_rate_limited_total{application="ResilientPOS", scope="store", instance="a"}
        values: 0+5x20
    alert_rule_test:
      - eval_time: 3m
        alertname: InboundStoreRateLimited
        exp_alerts: []
      - eval_time: 8m
        alertname: InboundStoreRateLimited
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "매장 단위 빈도 상한 거절이 5분 넘게 이어진다"
              runbook_url: https://github.com/char-labs/ResilientPOS/blob/main/docs/wiki/runbook.md#inboundstoreratelimited

  - name: 짧은 매장 거절과 이어지는 단말 거절은 울리지 않는다
    interval: 1m
    input_series:
      - series: inbound_rate_limited_total{application="ResilientPOS", scope="store", instance="a"}
        values: 0 0 3 6 6x20
      # 오래 오프라인이던 단말의 backlog 회복은 단말 bucket 거절을 길게 이어 가도 정상이다.
      - series: inbound_rate_limited_total{application="ResilientPOS", scope="terminal", instance="a"}
        values: 0+50x20
    alert_rule_test:
      - eval_time: 7m
        alertname: InboundStoreRateLimited
        exp_alerts: []
      - eval_time: 15m
        alertname: InboundStoreRateLimited
        exp_alerts: []
