# 로컬 개발 전용. 테스트는 이 파일을 쓰지 않고 Testcontainers로 PostgreSQL·Redis·Kafka를 띄운다.
# 저장소 루트에서 실행한다. 상대 경로는 이 파일의 디렉터리(docker/) 기준이다.
#   docker compose -f docker/docker-compose.yaml up -d                                  PostgreSQL·Redis·Kafka (앱은 IDE·bootRun으로)
#   docker compose -f docker/docker-compose.yaml --profile app up -d --build            + 앱 컨테이너
#   docker compose -f docker/docker-compose.yaml --profile app --profile obs up -d      + Alloy·Grafana LGTM (Grafana: localhost:3000, 알림 규칙·trace 포함)
# Alloy가 이 프로젝트 이름으로 앱 컨테이너를 고르므로 이름을 고정한다.
name: resilientpos

services:
  postgres:
    # 메이저를 고정한다. 테스트와 같은 메이저이고, latest면 다음 메이저에서 볼륨의 데이터 디렉터리를 읽지 못한다.
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: resilientpos
      POSTGRES_USER: resilientpos
      # 로컬 전용 기본값. 바꾸려면 docker/.env에 적는다(.env.example 참고).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resilientpos}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "resilientpos", "-d", "resilientpos"]
      interval: 2s
      timeout: 3s
      retries: 15

  # 결제 시도 생성·주문 생성의 중복 완화 잠금, 점주 세션(Spring Session), 점주 로그인 실패 카운터에 쓴다.
  # 세션은 필수라 Redis가 없으면 점주 요청이 실패한다(단말 /v1 경로는 영향 없다). 모두 TTL이 있는 키라 볼륨을 두지 않는다. 재시작하면 점주는 다시 로그인한다.
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # 모듈 사이 이벤트가 Kafka를 거치므로 앱은 이것 없이 이벤트를 전달하지 못한다. KRaft 단일 노드다.
  kafka:
    # 테스트(PostgresIntegrationTest)와 같은 버전이다.
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 앱 컨테이너는 kafka:19092, 호스트(IDE)는 localhost:9092로 붙는다.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 앱이 만든 토픽만 둔다. 이름이 틀린 발행이 조용히 새 토픽을 만들지 않고 실패한다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    volumes:
      # PostgreSQL 볼륨과 함께 남아야 커밋된 offset과 발행 기록이 어긋나지 않는다.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20

  app:
    profiles: [app]
    build:
      # gradlew와 src가 필요하므로 컨텍스트는 저장소 루트다. 제외 목록은 Dockerfile.dockerignore다.
      context: ..
      dockerfile: docker/Dockerfile
    # JVM 힙 비율(MaxRAMPercentage)의 기준이다. 없으면 Docker VM 전체 메모리를 기준으로 힙이 잡힌다.
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/resilientpos
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resilientpos}
      REDIS_HOST: redis
      # 앱이 뜨기 위한 자리값이다. compose에는 로컬 IdP가 없어 /admin은 쓸 수 없다.
      OPERATOR_ISSUER_URI: http://operator-idp.invalid
      OPERATOR_AUDIENCE: resilientpos-admin
      # stdout을 ECS JSON으로 내보내 Alloy가 필드로 읽게 한다.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # span을 Alloy(OTLP HTTP)로 보낸다. obs profile 없이 띄우면 보낼 곳이 없다.
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://alloy:4318/v1/traces
      # 느린 provider 측정(load-test/ S4)만 늘린다: FAKE_GATEWAY_LATENCY=PT1S docker compose ... up -d
      RESILIENTPOS_PAYMENT_FAKEGATEWAY_LATENCY: ${FAKE_GATEWAY_LATENCY:-PT0S}
    ports:
      - "8080:8080"

  alloy:
    profiles: [obs]
    image: grafana/alloy:latest
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - lgtm

  # Grafana·Loki·Prometheus·Tempo 올인원. 운영의 Mimir 자리를 여기서는 Prometheus가 맡는다.
  lgtm:
    profiles: [obs]
    image: grafana/otel-lgtm:latest
    volumes:
      # 이미지의 Prometheus 설정에는 rule_files가 없어 알림 규칙을 싣는 설정으로 바꾼다.
      - ./prometheus/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./prometheus/alerts.yaml:/otel-lgtm/alerts.yaml:ro
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  kafka-data:
