# 운영자 체인(/admin)은 issuer와 audience가 없으면 기동하지 않으므로 모든 테스트 컨텍스트에 둔다.
# .test는 해석되지 않는 예약 도메인이라 IdP에 실제로 닿지 않는다. Boot의 issuer decoder는 토큰을 처음 검증할 때 discovery를 하므로
# /admin에 토큰을 보내는 테스트는 OperatorTokens.IdpStub을 @Import해 discovery·JWK 응답을 대신 준다.
# public-key-location은 두지 않는다. issuer-uri와 함께 있으면 Boot가 공개키 decoder를 만들지 않는다(KeyValueCondition).
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://operator-idp.test
spring.security.oauth2.resourceserver.jwt.audiences=resilientpos-admin-test
