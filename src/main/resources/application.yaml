spring:
  application:
    name: ResilientPOS
  autoconfigure:
    exclude:
      # 점주 체인은 자격을 직접 확인하고 운영자 체인은 JWT를 검증하며 단말 경로는 Security를 쓰지 않아 UserDetailsService를 아무도 쓰지 않는다.
      # 두면 기동 때마다 임시 비밀번호 "Using generated security password"를 WARN으로 로그에 남긴다.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  security:
    oauth2:
      resourceserver:
        # 플랫폼 운영자(/admin)의 사내 IdP 토큰 검증(AdminSecurityFilterChain). issuer와 audience는 기본값을 두지 않는다.
        # 둘 중 하나라도 비면 체인이 거부해 기동이 멈춘다. 다른 IdP의 토큰이나 같은 IdP가 다른 앱에 준 토큰을 받지 않기 위해서다.
        jwt:
          issuer-uri: ${OPERATOR_ISSUER_URI:}
          audiences: ${OPERATOR_AUDIENCE:}
          # 권한을 담는 claim은 IdP마다 달라 배포가 정한다. 값을 접두어 없이 그대로 권한 이름으로 쓴다.
          authorities-claim-name: ${OPERATOR_AUTHORITIES_CLAIM:roles}
          authority-prefix: ""
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/resilientpos}
    username: ${POSTGRES_USER:resilientpos}
    # 기본값을 두지 않는다. 빈 문자열을 기본값으로 두면 환경 변수를 빠뜨린 인스턴스가 그대로 떠서
    # 실패가 기동이 아니라 첫 요청에서 드러난다. 테스트는 Testcontainers가 접속 값을 준다.
    # 주의: 해석되지 않은 placeholder는 예외가 아니라 리터럴 문자열로 바인딩된다. 그래서 기동이 멈추는
    # 실제 지점은 Hikari의 인증 실패이고 로그도 "password authentication failed"로 나온다.
    # DB가 trust 인증이면 아무 값이나 통과하므로 이 줄은 아무것도 막지 못한다. 알려진 한계다.
    password: ${POSTGRES_PASSWORD}
    hikari:
      # 풀이 비었을 때 기다리는 시간. 넘으면 요청이 실패하고 스레드를 돌려준다.
      # 잠금 대기를 3초로 제한한 checkout의 선례와 같은 값이다.
      connection-timeout: 3000
      validation-timeout: 1000
      data-source-properties:
        # JDBC 드라이버가 TCP에서 기다리는 시간(초). 이게 없으면 DB가 응답을 멈췄을 때
        # 아래 쿼리·트랜잭션 타임아웃이 돌기 전에 소켓에서 무기한 묶인다.
        connectTimeout: 3
        socketTimeout: 30
        # unique 위반 등의 서버 오류 상세("Key (email)=(...) already exists")를 예외 메시지에서 뺀다. 안 그러면 Hibernate가 WARN으로
        # 점주 이메일을 로그에 남긴다. 제약 이름은 메시지 본문에 남아 커밋을 연 Facade의 판정에 쓸 수 있다.
        logServerErrorDetail: false
  flyway:
    enabled: true
    postgresql:
      # 기본값(true)이면 Flyway가 자기 락을 쥔 트랜잭션을 CREATE INDEX CONCURRENTLY가 기다려 끝나지 않을 수 있다(도메인 모델 §4.7 질문 7).
      transactional-lock: false
  data:
    redis:
      # 쓰는 곳: (1) 결제 시도 생성·주문 생성의 중복 완화 잠금과 발행 기록 재전송·결과 불명 확정 작업의 pod 간 줄 세우기(platform.Lock),
      # (2) 점주 세션(Spring Session), (3) 점주 로그인 실패 카운터, (4) 단말·매장 빈도 상한(RedisTerminalRateLimiter). 정합성의 정본은 DB다.
      # 세션은 필수다. Redis가 죽으면 점주 요청(/owner)이 실패하고 단말 경로(/v1)는 막히지 않는다(잠금과 빈도 상한은 fail-open).
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 잠금과 빈도 상한은 Redis가 느리거나 없으면 그것 없이 진행한다(fail-open). 기본 60초를 기다리면 그동안 결제와 주문 생성, 단말 요청이 멈춘다.
      # 세션과 로그인 실패 카운터는 fail-closed다. 이 시간 안에 응답이 없으면 그 점주 요청은 503이고, 로그인은 비밀번호를 비교하지 않는다.
      # 연결이 끊긴 것을 Lettuce가 아는 동안에는 이 시간을 기다리지 않고 명령을 바로 거절한다. 응답 없는 명령은 1000개까지만 받는다(PlatformConfiguration).
      timeout: 1s
      connect-timeout: 1s
  web:
    resources:
      # 정적 파일을 서빙하지 않는다. `static/terminal`의 시연 화면은 인증 없이 열리고 sync endpoint를 부르므로
      # 운영 jar에 실려도 기본값에서는 404여야 한다. `demo` 프로필만 켠다(이 파일 맨 아래).
      add-mappings: false
  mvc:
    # FrameworkServlet이 요청 끝마다 ServletRequestHandledEvent를 만들며 request.getSession(false)로 세션 ID를 읽는다.
    # 세션 쿠키가 있으면 Spring Session이 Redis를 읽어, Redis 장애 때 단말 `/v1` 요청과 오류 응답까지 깨진다. 이 이벤트의 구독자는 없다.
    publish-request-handled-events: false
  jackson:
    factory:
      constraints:
        read:
          # 기본값은 문서 길이 -1(무제한), 문자열 1억 자다. 요청 하나가 읽는 양에 상한을 둔다.
          max-document-length: 1048576
          max-string-length: 65536
          # 기본값과 같다. 금액 거절 비용이 이 값에 기대고 있어서 적어 둔다
          # (money-input-boundary). 올리는 변경은 그 비용을 되살린다.
          max-number-length: 1000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      # 쿼리 하나가 도는 시간(ms). 넘으면 그 쿼리만 실패한다.
      jakarta.persistence.query.timeout: 10000
  task:
    execution:
      # 커밋 뒤 리스너(Modulith externalizer 포함)가 도는 applicationTaskExecutor로 요청의 trace를 넘긴다. 기본값 false면 Kafka 전송 span이 새 trace로 끊긴다.
      propagate-context: true
    scheduling:
      pool:
        # 공용 스케줄러의 기본 스레드는 하나라 결과 불명 확정 작업이 길어지면 발행 기록 재전송과 Moments가 멈춘다. 실제 PG PR이 조회 타임아웃과 함께 다시 본다.
        size: 2
  transaction:
    # 트랜잭션 하나가 도는 시간(초). 쿼리 여러 개로 나뉘어 각각은 상한 안이어도 전체가 길어질 수 있다.
    default-timeout: 30
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      # 전송 span을 만들고 레코드 header(traceparent)에 trace를 싣는다. 기본값 false. DLT 전송도 이 template을 쓴다.
      observation-enabled: true
    listener:
      # header의 trace를 이어 소비 span을 만든다. 기본값 false.
      observation-enabled: true
      # 재시도 대기는 consumer 스레드를 재운다. 스레드 하나가 파티션 여럿을 맡으면 한 주문의 실패가 그 파티션들을 모두 멈추므로
      # 파티션마다 스레드 하나를 둔다. pod가 여럿이면 남는 스레드는 파티션 없이 쉰다.
      concurrency: ${resilientpos.kafka.partitions}
    consumer:
      # 기본값 latest면 consumer가 파티션을 받기 전에 들어온 메시지를 건너뛴다. 처음 뜬 group도 처음부터 읽는다.
      auto-offset-reset: earliest
      # 기본값 500이면 레코드 처리가 느려질 때(DB가 느리거나 provider 호출) 한 poll의 처리가 max.poll.interval.ms(300초)를
      # 넘어 group에서 쫓겨나고 배치 전체가 다시 처리된다. 레코드 최대 처리 시간 × 이 값이 300초보다 충분히 작아야 한다.
      max-poll-records: 50
    admin:
      # 기동할 때 브로커에 닿지 못하면 앱을 띄우지 않는다. 끄면 토픽 없이 떠서 consumer가 조용히 논다.
      fail-fast: true
  modulith:
    events:
      # 기본값과 같다. 결정을 설정에 적어 Modulith를 올릴 때 기본값이 바뀌어도 뒤집히지 않게 한다.
      # update: 처리한 발행 기록에 완료 표시만 하고 행을 남긴다.
      completion-mode: update
      # 인스턴스가 여럿이면 같은 미완료 이벤트를 모두가 다시 보낸다. 브로커로 보내지 못한 기록의 재전송은
      # 주기 작업(EventPublicationResubmitter)이 맡는다.
      republish-outstanding-events-on-restart: false
      externalization:
        # 기본값과 같다. 켜면 브로커 전송을 한 번에 하나로 줄 세워 순서를 지키지만 처리량을 내준다.
        # consumer가 순서에 기대지 않고 멱등이라 끈다(kafka-event-redelivery spec의 공식 문서 점검).
        serialize-externalization: false

server:
  servlet:
    session:
      # 점주 세션(Spring Session Redis) 쿠키. Boot가 이 값을 Spring Session의 쿠키 직렬화기(DefaultCookieSerializer)에 옮긴다
      # (SessionAutoConfiguration). 유휴 만료(timeout)는 기본 30분을 그대로 쓴다.
      # secure: HTTPS에서만 전송한다. 로컬 HTTP(IDE·bootRun)에서 브라우저가 쿠키를 보내지 않으면 localhost는 예외로 보낸다.
      # context-path를 두면 쿠키 Path가 바뀌어 `__Host-` 규칙이 깨지고 브라우저가 쿠키를 버린다.
      # name: `__Host-` 접두어는 브라우저가 Secure·Path=/·Domain 없음을 강제해, 하위 도메인이 쿠키를 덮어쓰지 못하게 한다.
      cookie:
        name: __Host-SESSION
        http-only: true
        secure: true
        same-site: lax

resilientpos:
  event-publication:
    # 마지막 시도부터 이 시간이 지나도 끝나지 않은 기록을 끊긴 것으로 본다. metric의 stale과 재전송 작업이 함께 쓴다.
    # producer 전송 상한(max.block.ms + delivery.timeout.ms, 기본 약 3분)보다 길어야 한다. 짧으면 전송 중인 기록이 다시 나간다.
    # Modulith staleness 모니터(spring.modulith.events.staleness)는 끈 채로 둔다(EventPublicationResubmitter).
    stale-after: PT5M
    # 완료 뒤 이 기간이 지난 발행 기록을 지운다.
    retention: P7D
    # 재전송·정리 주기. 테스트가 늘려 작업이 스스로 돌지 않게 한다.
    resubmit-interval: PT1M
  payment:
    # 결과 불명 결제를 provider에 다시 묻는 주기.
    unknown-resolve-interval: PT1M
    # 조회 결과가 불명인 채로 이 횟수에 닿으면 시도를 reconciliation case로 넘기고 더 조회하지 않는다. 기본 간격에서 약 1시간이다.
    # 실제 PG를 근거로 삼지 못해 "결과 불명이 1시간 넘게 이어지면 사람이 본다"에 맞춘 값이다. 간격을 바꾸면 이 값이 뜻하는 시간도 바뀐다.
    unknown-query-limit: 60
  rate-limit:
    # 인증된 /v1 요청의 단말·매장 token bucket(RedisTerminalRateLimiter). capacity는 쉬었다 온 단말이 바로 보낼 수 있는 요청 수,
    # refill-per-second는 그 뒤로 이어 보낼 수 있는 초당 요청 수다. 매장 값은 그 매장 단말 전부의 합에 걸린다.
    # #77 k6 실측으로 정한 값이다. 매장 단말 4대를 전제로 매장 capacity가 4 × 단말 capacity다. 근거는 inbound-rate-limit spec 결정 8.
    terminal:
      capacity: 10
      refill-per-second: 2
    store:
      capacity: 40
      refill-per-second: 8
  kafka:
    # 이름은 저장 형식이다. 이벤트 클래스의 TOPIC 상수와 같아야 한다(KafkaConfiguration).
    topics: order.payment-requested,payment.attempt-created,payment.approved,order.paid,payment.reconciliation-requested
    # 처리량 근거가 아직 없다. 늘리면 KafkaAdmin이 기동하면서 파티션을 늘려 순서가 깨질 수 있으므로
    # 환경마다 바꾸지 말고 consumer를 비운 뒤 이 값을 고치는 PR로 바꾼다(KafkaConfiguration).
    partitions: 3
    # 복제 수는 적지 않는다. 없으면 브로커의 default.replication.factor를 따른다. 운영에서 설정을 빠뜨려도
    # 복제 1인 토픽이 생기지 않게 하려는 것이다. 굳이 정하려면 환경 변수 RESILIENTPOS_KAFKA_REPLICAS를 준다.
    retry:
      # 실제 provider가 없어 측정 근거가 없는 값이다. 경합은 1초에서 2배씩 5회, 합계 약 31초 동안 그 파티션이 멈춘다.
      # DB에 닿지 못하는 실패는 횟수 제한 없이 30초 간격까지 늘려 기다린다.
      initial-interval: PT1S
      max-retries: 5

management:
  tracing:
    sampling:
      # Boot 기본값은 0.1이다. 로그에 찍힌 traceId가 모두 Tempo에 있게 전부 남긴다. 낮추려면 MANAGEMENT_TRACING_SAMPLING_PROBABILITY.
      # 부하테스트에서 exporter·저장 비용이 보이면 Alloy tail sampling으로 바꾼다(observability-alerts-tracing spec).
      probability: 1.0
  # span을 보낼 곳(management.opentelemetry.tracing.export.otlp.endpoint)은 배포 환경 변수로만 준다. 없으면 exporter를 만들지 않는다.
  otlp:
    metrics:
      export:
        # spring-boot-starter-opentelemetry가 OTLP metric registry도 들인다. metric은 Prometheus scrape 한 경로로만 내보낸다.
        enabled: false
  health:
    redis:
      # 켜면 Redis 장애에 모든 pod의 readiness가 빠져 Redis 없이도 도는 단말 핫패스(/v1)까지 막힌다. 점주 요청만 실패하는 편이 낫다.
      # 잠금과 빈도 상한은 fail-open이라 결제와 주문 생성, 단말 요청은 Redis 없이도 계속된다. 세션과 로그인 카운터는 fail-closed라 점주 요청만 503이다.
      enabled: false
  endpoints:
    web:
      exposure:
        # health(프로브)와 prometheus(Prometheus나 Alloy가 scrape해서 Mimir로 보내는 대상)만 연다.
        # 인증이 없으므로 외부 차단은 배포에서 한다.
        include: health,prometheus
  metrics:
    tags:
      # 여러 서비스가 한 저장소에 모일 때 대시보드가 서비스를 가르는 기준이다.
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # 기본값은 _count·_sum·_max뿐이라 p95를 계산할 수 없다. bucket을 내보내 histogram_quantile로 구한다.
        http.server.requests: true

logging:
  level:
    # Redis의 응답 없는 명령이 queue 상한(PlatformConfiguration)을 채우면 Lettuce가 거절마다 스택이 붙은 WARN
    # ("Unexpected exception during request")을 이 로거로 남긴다. 이 로거의 WARN은 그 한 종류뿐이고, 실패는 호출자(빈도 상한·세션·잠금)가
    # 이미 남긴다. 그대로 두면 단절 동안 로그 양이 Redis 명령 수와 같아진다. Lettuce를 올리면 이 로거가 남기는 WARN 종류를 다시 본다.
    io.lettuce.core.protocol.DefaultEndpoint: ERROR

# 구조화 로그는 여기 적지 않는다. 배포 환경에서 LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs를 주면
# stdout이 한 줄에 JSON 객체 하나가 되어 Loki(Alloy)가 필드로 읽는다. 기본값은 사람이 읽는 평문이다.
---
# 시연 화면(`/terminal/index.html`)을 여는 프로필. 로컬 시연에서만 켠다: SPRING_PROFILES_ACTIVE=demo
spring:
  config:
    activate:
      on-profile: demo
  web:
    resources:
      add-mappings: true
