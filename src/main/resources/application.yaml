spring:
  application:
    name: ResilientPOS
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/resilientpos}
    username: ${POSTGRES_USER:resilientpos}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
